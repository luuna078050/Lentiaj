name: Build Android APK
on:
  push:
    branches: [ main, 'mvp/**' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
      - name: Create Android Flutter scaffold
        run: flutter create --platforms=android --project-name=lenivets build_app
      - name: Copy MVP app into scaffold
        run: |
          cp pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/lib
          cp -r lib build_app/lib
      - name: Get dependencies
        working-directory: build_app
        run: flutter pub get
      - name: Build debug APK
        working-directory: build_app
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: lenivets-debug-apk
          path: build_app/build/app/outputs/flutter-apk/app-debug.apk
